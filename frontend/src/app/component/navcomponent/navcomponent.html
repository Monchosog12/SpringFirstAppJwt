<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container-fluid">

    <a class="navbar-brand" routerLink="/">
      <i class="bi bi-shield-lock"></i> Spring JWT
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarPrincipal"
      aria-controls="navbarPrincipal"
      aria-expanded="false"
      aria-label="Mostrar navegación">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarPrincipal">

      @if (authService.usuario()) {
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }">
              Usuarios
            </a>
          </li>
          @if (authService.esAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/nuevo-usuario" routerLinkActive="active">
                Nuevo usuario
              </a>
            </li>
          }
        </ul>

        <div class="sesion">
          <span class="nombre-usuario">
            <i class="bi bi-person-circle"></i> {{ authService.usuario() }}
          </span>
          <span class="badge" [class.bg-danger]="authService.esAdmin()" [class.bg-secondary]="!authService.esAdmin()">
            {{ authService.rol() }}
          </span>
          <button type="button" class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">
            Cerrar sesión
          </button>
        </div>
      } @else {
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/registro" routerLinkActive="active">Registrarse</a>
          </li>
        </ul>
      }

    </div>

  </div>
</nav>
