<div class="contenedor-formulario">

  <div class="header">
    <h2>Nuevo usuario</h2>
  </div>

  <form class="formulario" (ngSubmit)="guardar()">

    @if (error()) {
      <div class="alerta alerta-error">{{ error() }}</div>
    }

    <div class="campo">
      <label for="username">Usuario</label>
      <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
        required
        placeholder="Ingrese el nombre de usuario">
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="new-password"
        placeholder="Ingrese la contraseña">
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label for="edad">Edad</label>
        <input
          type="number"
          id="edad"
          name="edad"
          [(ngModel)]="edad"
          required
          min="0"
          placeholder="Ingrese la edad">
      </div>

      <div class="campo">
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input
          type="date"
          id="fechaNacimiento"
          name="fechaNacimiento"
          [(ngModel)]="fechaNacimiento"
          required>
      </div>
    </div>

    <div class="campo">
      <label for="role">Rol</label>
      <select id="role" name="role" [(ngModel)]="role" required>
        <option [ngValue]="null">Seleccione un rol</option>
        <option ngValue="USER">USER</option>
        <option ngValue="ADMIN">ADMIN</option>
      </select>
    </div>

    <div class="acciones">
      <button type="submit" class="btn-guardar" [disabled]="guardando()">
        Guardar
      </button>
      <button type="button" class="btn-cancelar" routerLink="/">
        Cancelar
      </button>
    </div>

  </form>

</div>
