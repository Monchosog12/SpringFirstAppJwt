<div class="contenedor-auth">

  <div class="tarjeta">

    <div class="header">
      <h2><i class="bi bi-person-plus"></i> Crear cuenta</h2>
    </div>

    <form class="formulario" (ngSubmit)="registrar()">

      @if (error()) {
        <div class="alerta alerta-error">{{ error() }}</div>
      }
      @if (mensaje()) {
        <div class="alerta alerta-exito">{{ mensaje() }}</div>
      }

      <div class="campo">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
          autocomplete="username"
          placeholder="Ingrese un nombre de usuario">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="new-password"
          placeholder="Ingrese una contraseña">
      </div>

      <div class="campo">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input
          type="password"
          id="confirmarPassword"
          name="confirmarPassword"
          [(ngModel)]="confirmarPassword"
          required
          autocomplete="new-password"
          placeholder="Repita la contraseña">
      </div>

      <div class="fila-campos">
        <div class="campo">
          <label for="edad">Edad</label>
          <input
            type="number"
            id="edad"
            name="edad"
            [(ngModel)]="edad"
            required
            min="0"
            placeholder="Edad">
        </div>

        <div class="campo">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input
            type="date"
            id="fechaNacimiento"
            name="fechaNacimiento"
            [(ngModel)]="fechaNacimiento"
            required>
        </div>
      </div>

      <div class="acciones">
        <button type="submit" class="btn-guardar" [disabled]="guardando()">
          Registrarse
        </button>
        <button type="button" class="btn-cancelar" routerLink="/login">
          Cancelar
        </button>
      </div>

      <p class="enlace">
        ¿Ya tiene cuenta? <a routerLink="/login">Inicie sesión</a>
      </p>

    </form>

  </div>

</div>
